# Gateway API Preset
#
# Minimal Istio installation for Gateway API support only.
# Includes istiod configured as a Gateway API controller.
# Does not include sidecar injection, telemetry, or full service mesh features.
#
# Components installed:
# - istiod (minimal configuration)
# - istio-cni (required on OpenShift)
#
# Components NOT installed:
# - ztunnel (ambient mesh)

name: gateway-api
description: |
  Minimal Istio installation for Gateway API support only.
  Includes istiod configured as a Gateway API controller.
  Does not include sidecar injection, telemetry, or service mesh features.
baseProfile: openshift
components:
  istiod: true
  cni: true
  ztunnel: false
values:
  pilot:
    autoscaleEnabled: false
  global:
    proxy:
      autoInject: disabled
  sidecarInjectorWebhook:
    enableNamespacesByDefault: false
